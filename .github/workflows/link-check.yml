name: Check links

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  htmlproofer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Run HTMLProofer
        run: |
          gem install html-proofer
          bundle exec htmlproofer ./_site \
            --assume-extension \
            --http-status-ignore 0,403,429 \
            --url-ignore "/fonts.gstatic.com/,/hm.baidu.com/,/unpkg.com/gitalk/,/ghbtns.com/" \
            --only-4xx \
            --no-enforce-https \
            || echo "::warning::Some links failed"
