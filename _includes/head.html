<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords"  content="{{ site.keyword }}">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">
    
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <!-- Web App Manifest -->
    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">

    <!-- Safari Webpage Icon -->
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/img/apple-touch-icon.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">

    <!-- Pygments Github CSS -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- UI enhancements (progress bar, back-to-top, code copy, nav active) -->
    <link rel="stylesheet" href="{{ "/css/ui-enhance.css" | prepend: site.baseurl }}">

    <!-- Hero header slim + dark mask -->
    <link rel="stylesheet" href="{{ "/css/hero-overrides.css" | prepend: site.baseurl }}">

    <!-- CJK typography overrides -->
    <link rel="stylesheet" href="{{ "/css/cjk-typography.css" | prepend: site.baseurl }}">

    <!-- Post preview cards -->
    <link rel="stylesheet" href="{{ "/css/post-card.css" | prepend: site.baseurl }}">

    <!-- Dark mode (must come after other styles for proper override) -->
    <link rel="stylesheet" href="{{ "/css/dark-mode.css" | prepend: site.baseurl }}">

    <!-- Page-specific styles -->
    <link rel="stylesheet" href="{{ "/css/archive.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts: Font Awesome 6 (async loaded, does not block render) -->
    <link rel="stylesheet"
          href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>


    <!-- Hux Delete, sad but pending in China
    <link href='http://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800' rel='stylesheet' type='text/
    css'>
    -->


    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <!-- RSS feed -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS Feed" href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">

    <!-- jekyll-seo-tag: Open Graph / Twitter Card / JSON-LD -->
    {%- seo -%}

    <!-- Theme init (run before paint to avoid FOUC) -->
    <script>
    (function(){
      try {
        var t = localStorage.getItem('zhanglibo-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e) {}
    })();
    </script>

    <!-- ga & ba script hoook -->
    <script></script>
</head>
